apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
  namespace: demo
  labels:
    app: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: service-b        # a kustomization.yaml "images" része cseréli az ECR címre
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
  namespace: demo
spec:
  type: ClusterIP
  selector:
    app: service-b
  ports:
  - port: 80
    targetPort: 8080
