apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-conf
  namespace: demo
data:
  default.conf: |
    server {
        listen 8080;

        # Az NLB health check és a readiness probe ide jön
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # FONTOS: a proxy_pass végén NINCS perjel, így a teljes útvonal (/api/sa) megy tovább,
        # és a Flask app pont erre az útvonalra figyel.
        location /api/sa {
            proxy_pass http://service-a.demo.svc.cluster.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/sb {
            proxy_pass http://service-b.demo.svc.cluster.local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404 "Not found. Try /api/sa or /api/sb\n";
        }
    }
